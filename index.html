<!doctype html>
<html lang="en" class="white">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./output.css" rel="stylesheet" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <title>Document</title>
    <script type="module" src="./js/main.js"></script>
  </head>
  <body class="flex gap-2 justify-center my-10 font-serif text-xs">
    <main class="flex flex-col items-center">
      <section>
        <header class="flex justify-center">
          <img src="./banna.png" class="w-[60%]" />
        </header>
      </section>
      <section class="mb-10">
        <h1 class="text-2xl">Mewford's Basket</h1>
        <p>A very overcomplicated and slow music tracking place - thingy</p>
      </section>

      <section class="w-full mb-10">
        <h2>Add a Forage Target</h2>

        <form class="flex flex-col" id="foraging-form">
          <label for="text"> Name </label>
          <input type="text" id="name" name="name" required />

          <label for="artist"> Artist </label>
          <input type="text" id="artist" name="artist" required />

          <label for="type"> Type </label>
          <select id="type" name="type" required>
            <option value="Album">Album</option>
            <option value="Single">Single</option>
          </select>

          <label for="track-count">Track Count</label>
          <input type="number" id="track-count" name="track-count" required />

          <label for="discovered">Discovered</label>
          <input type="date" id="discovered" name="discovered" required />

          <div id="buttonholder" class="flex gap-2 w-full">
            <button type="submit" id="add-btn">Add</button>
            <button type="submit" id="update-btn" hidden>Update</button>
            <button type="button" id="cancel-btn" hidden>Cancel</button>
          </div>
        </form>
      </section>

      <section class="w-full">
        <h2>Foraging Targets</h2>

        <div id="foragingList" class="overflow-y-auto max-h-70"></div>
      </section>
    </main>
  </body>
</html>
